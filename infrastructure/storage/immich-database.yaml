apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5-1
  storage:
    size: 20Gi
  bootstrap:
    initdb:
      database: immich
      owner: immich
  monitoring:
    enabled: true
  postgresql:
    parameters:
      shared_preload_libraries: "pg_stat_statements"
