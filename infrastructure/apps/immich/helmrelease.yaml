apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: 0.24.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    env:
      DB_HOSTNAME: immich-db-rw
      DB_PORT: "5432"
      DB_DATABASE_NAME: immich
      DB_USERNAME: immich
    persistence:
      library:
        existingClaim: immich-library
    metrics:
      enabled: true
    redis:
      enabled: false
    valkey:
      enabled: true
      auth:
        enabled: false
